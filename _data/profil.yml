# Phrase d'accroche de l'accueil (grand texte animé).
accroche_fr: "Je transforme la donnée en décisions mesurées. Modéliser l’incertitude, tester sans tricher, décider sous contraintes : des réseaux d’eau aux marchés financiers."
accroche_en: "I turn data into measured decisions. Modelling uncertainty, testing without cheating, deciding under constraints: from water networks to financial markets."

# Courte présentation à côté de l'accroche.
presentation_fr: "Étudiant ingénieur en Big Data et IA à l’Université Internationale de Rabat, je conçois des systèmes d’IA qui décident sous incertitude, des infrastructures aux marchés financiers, et je les mesure sans complaisance."
presentation_en: "A Big Data and AI engineering student at the International University of Rabat, I design AI systems that decide under uncertainty, from infrastructure to financial markets, and I measure them honestly."

# Page À propos : premier paragraphe en grand, puis les suivants.
a_propos_fr:
  - Étudiant ingénieur en Big Data et intelligence artificielle à l’Université Internationale de Rabat, je me prépare aux métiers d’ingénieur IA, d’ingénieur IA en finance et de chercheur quantitatif.
  - Après deux années de classes préparatoires MPI (mathématiques, physique, informatique) à 2iE, à Ouagadougou, je suis entré le 7 septembre 2026 en première année du cycle ingénieur à l’UIR, ma troisième année d’études supérieures.
  - "Mes projets ont un point commun : décider sous incertitude, et le prouver par des mesures honnêtes. Piloter des pompes sous délestage par apprentissage par renforcement, ou rétro-concevoir une stratégie de trading à partir de 41,5 Go de données on-chain, c’est le même métier : un modèle n’a de valeur que s’il survit aux coûts réels et aux données qu’il n’a jamais vues."
a_propos_en:
  - A Big Data and Artificial Intelligence engineering student at the International University of Rabat, preparing for roles as an AI engineer, an AI engineer in finance or a quantitative researcher.
  - After two years of MPI preparatory classes (mathematics, physics, computer science) at 2iE in Ouagadougou, I started the engineering programme at UIR on 7 September 2026, my third year of higher education.
  - "My projects share one thread: deciding under uncertainty, and proving it with honest measurements. Running pumps through power cuts with reinforcement learning, or reverse-engineering a trading strategy from 41.5 GB of on-chain data, is the same craft: a model is only worth something if it survives real costs and data it has never seen."

# Résumé en tête du CV.
cv_profil_fr: "Étudiant en première année du cycle ingénieur Big Data et IA à l’UIR, après deux années de classes préparatoires MPI. Je conçois des systèmes d’IA qui décident sous incertitude, de l’apprentissage par renforcement à la modélisation financière, avec des évaluations honnêtes : données hors échantillon, coûts réels, aucune fuite."
cv_profil_en: "First-year Big Data & AI engineering student at UIR, after two years of MPI preparatory classes. I design AI systems that decide under uncertainty, from reinforcement learning to financial modelling, with honest evaluation: out-of-sample data, real costs, no leakage."

interets_fr: Marchés financiers, finance quantitative, raisonnement des IA (ARC-AGI), innovation à impact, prise de parole en public.
interets_en: Financial markets, quantitative finance, AI reasoning (ARC-AGI), impact-driven innovation, public speaking.

# Les qualités de la page À propos.
qualites:
  - titre_fr: Rigueur
    titre_en: Rigour
    texte_fr: Chaque résultat est mesuré, testé et reproductible. Les limites sont écrites, pas cachées.
    texte_en: Every result is measured, tested and reproducible. Limits are written down, not hidden.
  - titre_fr: Honnêteté des résultats
    titre_en: Honest results
    texte_fr: "Coûts réels, données hors échantillon, aucune fuite d’information : un backtest qui triche ne prouve rien."
    texte_en: "Real costs, out-of-sample data, no leakage: a backtest that cheats proves nothing."
  - titre_fr: Leadership
    texte_fr: Président d’un club d’art oratoire et chef de projet sur des projets primés.
    texte_en: President of a public-speaking club and project lead on award-winning projects.
  - titre_fr: Persévérance
    titre_en: Persistence
    texte_fr: Je m’investis sur le long terme, de la première idée au prototype qui fonctionne.
    texte_en: I commit for the long run, from the first idea to a prototype that works.


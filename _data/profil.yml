# Courte présentation à côté de l'accroche.
presentation_fr: Étudiant ingénieur en Big Data et intelligence artificielle à l’Université Internationale de Rabat, j’allie modélisation, code et sens du terrain pour résoudre des problèmes réels.
presentation_en: A Big Data and Artificial Intelligence engineering student at the International University of Rabat, I combine modelling, code and field sense to solve real problems.

# Page À propos : premier paragraphe en grand, puis les suivants.
a_propos_fr:
  - Étudiant ingénieur en Big Data et intelligence artificielle à l’Université Internationale de Rabat, je construis des solutions qui partent du terrain.
  - Après deux années de classes préparatoires MPI (mathématiques, physique, informatique) à 2iE, à Ouagadougou, je suis entré le 7 septembre 2026 en première année du cycle ingénieur à l’UIR, ma troisième année d’études supérieures.
  - "J’ai conçu et porté plusieurs projets qui mêlent ingénierie, IA et développement durable, récompensés à plusieurs reprises. J’aime donner du sens aux idées : transformer un problème complexe en une solution claire, mesurable et utile à ceux qui le vivent."
a_propos_en:
  - A Big Data and Artificial Intelligence engineering student at the International University of Rabat, I build solutions that start from real life.
  - After two years of MPI preparatory classes (mathematics, physics, computer science) at 2iE in Ouagadougou, I started the engineering programme at UIR on 7 September 2026, my third year of higher education.
  - "I have designed and led several award-winning projects that combine engineering, AI and sustainability. I like giving ideas a purpose: turning a complex problem into a clear, measurable solution that helps the people who live with it."

# Résumé en tête du CV.
cv_profil_fr: "Étudiant en première année du cycle ingénieur Big Data et IA à l’UIR, après deux années de classes préparatoires MPI. Je conçois des projets qui mettent la donnée et l’intelligence artificielle au service de besoins concrets : l’eau, l’énergie, l’agriculture."
cv_profil_en: "First-year Big Data & AI engineering student at UIR, after two years of MPI preparatory classes. I build projects that put data and artificial intelligence to work on real needs: water, energy and agriculture."

interets_fr: Big Data, intelligence artificielle, cybersécurité, innovation à impact, art et prise de parole en public.
interets_en: Big Data, artificial intelligence, cybersecurity, impact-driven innovation, art and public speaking.


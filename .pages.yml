# ---------------------------------------------------------------
# Pages CMS : des formulaires pour mettre le site à jour sans toucher au code.
# Ouvre https://app.pagescms.org, connecte-toi avec GitHub et choisis ce dépôt.
# Chaque « Enregistrer » crée un commit ; GitHub Pages republie le site en 1 à 2 minutes.
# ---------------------------------------------------------------

media:
  input: assets/img
  output: /assets/img
  categories: [image]
  rename: safe

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Ajout : {path}"
      update: "Mise à jour : {path}"
      delete: "Suppression : {path}"
      rename: "Renommage : {oldPath} en {newPath}"

components:
  afficher:
    type: boolean
    label: Afficher sur le site
    description: Décoche pour cacher sans supprimer. Recoche pour le faire revenir.
    default: true
  cv:
    type: boolean
    label: Mettre dans le CV
    default: true
